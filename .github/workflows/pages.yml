name: Publish documentation portal

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.MD"
      - "**/*.pdf"
      - "**/*.vsdx"
      - "index.html"
      - "docs-manifest.json"
      - ".nojekyll"
      - "site/**"
      - ".github/workflows/pages.yml"
      - "scripts/Build-DocsSite.ps1"
      - "scripts/Test-DocsSite.ps1"
  workflow_dispatch:
  repository_dispatch:
    types:
      - stage-snapshot

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  documentation-portal-gate:
    name: Documentation Portal Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Evaluate IS_ORIGIN
        id: gate
        shell: bash
        env:
          IS_ORIGIN: ${{ vars.IS_ORIGIN }}
        run: |
          set -euo pipefail
          if [[ "${IS_ORIGIN,,}" == "true" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Documentation portal workflow is disabled for the origin repository."
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Documentation portal workflow is enabled for the mirror repository."
          fi

  deploy:
    needs: documentation-portal-gate
    name: Publish Python documentation portal
    if: needs.documentation-portal-gate.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Build documentation site
        shell: pwsh
        run: ./scripts/Build-DocsSite.ps1
      - name: Validate generated documentation site
        shell: pwsh
        run: ./scripts/Test-DocsSite.ps1
      - name: Skip GitHub Pages deployment for private repository
        if: github.event.repository.visibility != 'public'
        run: echo "Repository is private; GitHub Pages configuration and deployment will be skipped."
      - name: Configure GitHub Pages
        if: github.event.repository.visibility == 'public'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        if: github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy
        if: github.event.repository.visibility == 'public'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
